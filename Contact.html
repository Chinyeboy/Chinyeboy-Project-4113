<!-- CONTACT SECTION -->
<section class="container py-5">
    <h1 class="section-title">Contact Us</h1>
    <p class="text-center mb-5">Have a question? Send us a message.</p>

    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="contact-box shadow">

                <form id="contactForm">
                    <div class="mb-3">
                        <label class="form-label">Your Name</label>
                        <input type="text" id="name" class="form-control" placeholder="Enter your name" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Your Email</label>
                        <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Subject</label>
                        <input type="text" id="subject" class="form-control" placeholder="Enter subject" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Your Message</label>
                        <textarea id="message" class="form-control" rows="5" placeholder="Write your message" required></textarea>
                    </div>

                    <button type="submit" class="btn btn-warning w-100">Send Message</button>

                    <p id="formMessage" class="mt-3 text-center"></p>
                </form>

            </div>
        </div>
    </div>
</section>
